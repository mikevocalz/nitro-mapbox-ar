name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'revival/**'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate Nitro native-map bindings
        run: npm run codegen:native-map

      - name: Typecheck core
        run: npm run typecheck

      - name: Typecheck native-map package
        run: npm run typecheck:native-map

      - name: Typecheck ReactVision adapter
        run: npm run typecheck:reactvision

      - name: Typecheck agent MCP helpers
        run: npm run typecheck:agent-mcp

      - name: TypeScript unit tests
        run: npm test

      - name: Native Terrain-RGB codec tests
        run: npm run test:cpp

      - name: Verify npm package surface
        run: npm run check:package-surface

      - name: Verify browser package surface
        run: npm run check:web-surface


  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install browser harness
        working-directory: examples/web-test
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build browser harness
        working-directory: examples/web-test
        run: npm run build
